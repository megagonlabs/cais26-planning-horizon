# @package _group_
type: "husky_commonsense_agent"
prompt:
    generation:
        system: |
            Given the input question, the solution history that consists of steps for solving the input question and their corresponding outputs (optional), and the current sub-question that needs to be answered to solve the question, solve the current step using logical reasoning, basic math and commonsense knowledge.

            Below are a few examples of the generated output. You are expected to provide the answer below "Expected Output".

            ---
            **Question:**
            Which type of currency would one be advised to bring if visiting that has Mae Hong Son Province within its borders?

            **History:**
            Step: Identify the country that has Mae Hong Son Province within its borders.
            Output:
            The country that has Mae Hong Son Province within its borders is Thailand.

            **Sub-question:**
            Determine the type of currency used in Thailand.

            **Expected Output:*
            The currency used in Thailand is the Thai Baht.
            ---
            **Question:**
            What happened first, the Selective Draft Law Cases in the United States or Eugene Debs' run for president for the last time?

            **History:**
            Step: Identify the year the Selective Draft Law Cases were decided in the United States.
            Output:
            The Selective Draft Law Cases were decided in the year 1918.

            Step: Identify the year Eugene Debs ran for president for the last time.
            Output:
            Eugene Debs ran for president for the last time in the year 1920.

            **Sub-question:**
            Determine which event happened first.

            **Expected Output:**
            Since the Selective Draft Law Cases were decided in 1918 and Eugene Debs ran for president in 1920, the Selective Draft Law Cases happened first.
            ---
            **Question:**
            Who was the president of the body that petitioned the king of England to recognize the rights of colonists when the declaration of independence was adopted?

            **History:**
            [none]

            **Sub-question:**
            Identify the body that petitioned the king of England to recognize the rights of colonists when the Declaration of Independence was adopted.

            **Expected Output:**
            The body that petitioned the king of England to recognize the rights of colonists when the Declaration of Independence was adopted was the Second Continental Congress.
            ---
            **Question:**
            Mark has a garden with flowers. He planted plants of three different colors in it. Ten of them are yellow, and there are 80 percent more of those in purple. There are only 25 percent as many green flowers as there are yellow and purple flowers. How many flowers does Mark have in his garden?

            **History:**
            Step: Compute the number of purple flowers in the garden.
            Output:
            There are 80/100 * 10 = 8 more purple flowers than yellow flowers. Therefore, there are 10 + 8 = 18 purple flowers.

            **Sub-question:**
            Compute the number of green flowers in the garden.

            **Expected Output:**
            The yellow and purple flowers sum up to 10 + 18 = 28 flowers. There are 25/100 * 28 = 7 green flowers in Mark's garden.
            ---
            **Question:**
            Who threw the most touchdown passes in the game between the Seattle Seahawks and the Washington Redskins where Shaun Suisham made a 26-yard field goal in the third quarter?

            **History:**
            Step: Identify the date of the game between the Seattle Seahawks and the Washington Redskins where Shaun Suisham made a 26-yard field goal in the third quarter.
            Output:
            The game between the Seattle Seahawks and the Washington Redskins, where Shaun Suisham made a 26-yard field goal in the third quarter, took place on November 23, 2008.

            Step: Retrieve information about the game.
            Output:
            ['Quarter', 'Time', 'Tm', 'Detail', 'WAS', 'SEA']
            ['1', '7:19', 'Seahawks', 'Olindo Mare 45 yard field goal', '0', '3']
            ['2', '4:32', 'Redskins', 'Ladell Betts 1 yard rush (Shaun Suisham kick)', '7', '3']
            ['2', '0:29', 'Seahawks', 'Maurice Morris 4 yard pass from Matt Hasselbeck (Olindo Mare kick)', '7', '10']
            ['3', '7:21', 'Redskins', 'Shaun Suisham 26 yard field goal', '10', '10']
            ['3', '3:25', 'Redskins', 'Antwaan Randle El 8 yard pass from Jason Campbell (Shaun Suisham kick)', '17', '10']
            ['4', '13:24', 'Seahawks', 'John Carlson 10 yard pass from Matt Hasselbeck (Olindo Mare kick)', '17', '17']
            ['4', '9:19', 'Redskins', 'Shaun Suisham 22 yard field goal', '20', '17']

            **Sub-question:**
            Compare the number of touchdown passes thrown by each quarterback in the game.

            **Expected Output:**
            According to the game information, Matt Hasselbeck threw 2 touchdown passes for the Seattle Seahawks, and Jason Campbell threw 1 touchdown pass for the Washington Redskins. Therefore, Matt Hasselbeck threw the most touchdown passes in the game.
            ---
            **Question:**
            There were 12 balloons that were either green, blue, yellow, or red. They were divided into equal groups and then Anya took half of the yellow ones home. How many balloons did Anya take home?

            **History:**
            [none]

            **Sub-question:**
            Identify the number of yellow balloons.

            **Expected Output:**
            Since the balloons are divided into equal groups and there are four colors, the number of yellow balloons is $\frac{12}{4} = 3$.
            ---
            **Question:**
            Nathan will roll two six-sided dice. What is the probability that he will roll a number less than three on the first die and a number greater than three on the second die? Express your answer as a common fraction.

            **History:**
            Step: Compute the probability that Nate rolls a number less than three on the first die.
            Output:
            For the first die to be less than three, it must be a 1 or a 2, which occurs with probability $\frac{1}{3}$.

            **Sub-question:**
            Compute the probability that Nate rolls a number greater than three on the second die.

            **Expected Output:**
            For the second die to be greater than 3, it must be a 4 or a 5 or a 6, which occurs with probability $\frac{1}{2}$.
            ---
            **Question:**
            What major river runs through the city where Al-Maqrizi was born?

            **History:**
            Step: Identify the city where Al-Maqrizi was born.
            Output:
            Al-Maqrizi was born in Cairo.

            **Sub-question:**
            Identify the major river that runs through Cairo.

            **Expected Output:**
            The major river that runs through Cairo is the Nile River.
            ---
        user: |
            **Question:**
            {query}

            **History:**
            {history}

            Solve the following task using logical reasoning, basic math and commonsense knowledge.

            **Sub-question:**
            {sub_question}
    synthesis:
        system: |
            Given the question and the response, use only the information from the response to answer the question concisely. Exclude any details that are not directly relevant to the question.

            Your task:
            1. Provide a short summary of the reasoning process used to arrive at the answer. Examine if the provided information is sufficient to fully and directly answer the question.
            2. Provide the concise answer value without verbose expressions like "The answer to <question> is...".
            3. Indicate whether the found answer fully and directly addresses the question.
            4. If the answer does not fully and directly address the question, provide the reason for failure. For example:
                - "No answer found: <short details>" (when the response does not contain a clear answer)
                - "Only partial answer found: <short details>" (when the response contains some relevant information but not enough to fully answer the question)
        user: |
            Only use the information from the given response to answer the question concisely. If the response does not contain relevant information, respond with "No answer found: <short details>".

            **Question:**
            {query}

            **Response to evaluate**
            {response}
