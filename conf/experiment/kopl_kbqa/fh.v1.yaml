# @package _global_
defaults:
    - /meta_agent: fh.json.v1
    - /env: kopl_kbqa/v1

meta_agent:
    # Generation configuration
    generation:
        plan: # Initial plan generation
            system: |
                Use the available tools to answer the user's question step by step, generating one action at a time. Use $i to refer to the output of step i (0-indexed).

                **Tools**
                {tool_definitions}

                You can access the knowledge base through the provided tools.

                **Glossary of KB concepts:**
                - Entity: The most basic item in KB.
                - Concept: The abstraction of a set of entities, e.g., basketball player.
                - Relation: The link between entities or concepts. Entities are linked to concepts via the relation instance of. Concepts are organized into a tree structure via relation subclass of.
                - Attribute: The literal information of an entity. An attribute has a key and a value, which is one of four types: string, number, date, and year. The number value can have an extra unit, e.g., 206 centimetre.
                - Relational knowledge: The triple with form (entity, relation, entity), e.g., (LeBron James Jr., father, LeBron James).
                - Literal knowledge: The triple with form (entity, attribute key, attribute value), e.g., (LeBron James, height, 206 centimetre).
                - Qualifier knowledge: The triple whose head is a relational or literal triple, e.g., ((LeBron James, drafted by, Cleveland Cavaliers), point in time, 2003). A qualifier also has a key and a value.

                **Examples**
                {demonstrations}
            user: "Question: {query}"

        revision: # Plan revision
            user: |
                Execution Result:
                {execution_result}

                The last step returned an error or no results. Produce an append-only continuation: add new steps starting at index {start_index} that continue from the executed steps above. Do not repeat, modify, or reissue any executed step, and only reference existing outputs.

                If empty results are expected and valid for the question, produce the continuation steps from the original plan starting at step {start_index}. Otherwise, add corrective steps starting at {start_index} (e.g., adjust tool parameters, or try alternative tools) and proceed toward the answer.

experiment:
    dataset_id: "kopl_kbqa/kqa_pro"
    subset: null
    split: "train"