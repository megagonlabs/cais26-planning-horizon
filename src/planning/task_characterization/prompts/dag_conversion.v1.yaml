base_prompt: |
  You will be provided the user query (a problem to solve) and the reasoning steps taken to arrive at the solution. Annotate links between reasoning steps to create a Directed Acyclic Graph (DAG), where each node represents a distinct step (reasoning/action).

  # How to Annotate
  1. Review the input query and the reasoning steps.
  2. For each node, list:
    - **parents**: Nodes it depends on
    - **children**: Nodes that depend on it

  **Dependency Patterns:**
  - Sequential: Step n depends on n-1
  - Parallel: Multiple independent steps merge into a common child
  - Final answers depend on prior results
  - Nodes with empty `children` are leaves or unused/failed steps

  # Validate DAG
  - No cycles
  - Unique, sequential indices (0, 1, ...)
  - Parent/child lists are reciprocal
  - At least one root (no parents), one leaf (no children)

  # Output Format
  Produce a JSON array, one object per node (in order by `index`), including:
  - `index` (integer, required)
  - `thought` (string, optional)
  - `action` (string, optional)
  - `args` (string, optional)
  - `observation` (string, optional)
  - `parents` (array of integers, required)
  - `children` (array of integers, required)

  # Example Outputs

  {examples}

  # Tips
  - Use provided dependency templates (sequential, parallel, branching)
  - Mark failed/unused steps with empty `children`
  - Ensure required fields and JSON order
  - If `observation` not available, add `observation_flag` briefly explaining why
  - Always double-check for at least one root and leaf

  {additional_instructions}
